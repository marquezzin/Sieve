<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/sieve-logo.png" />
    <title>Sieve</title>
    <script>
      // Espelha o ColorSchemeScript do Mantine antes do React montar, evitando
      // flash de tema no load. Lê a chave que o Mantine persiste em localStorage.
      (function () {
        try {
          var scheme = localStorage.getItem('mantine-color-scheme-value') || 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
