from django.db import migrations
import json

def add_periodic(apps, schema_editor):
    Interval = apps.get_model("django_celery_beat", "IntervalSchedule")
    Periodic = apps.get_model("django_celery_beat", "PeriodicTask")
    sched, _ = Interval.objects.get_or_create(every=5, period="minutes")
    Periodic.objects.update_or_create(
        name="healthcheck.tick",
        defaults={"interval": sched, "task": "healthcheck.tasks.tick", "kwargs": json.dumps({})},
    )

class Migration(migrations.Migration):
    dependencies = [("healthcheck", "0001_initial"), ("django_celery_beat", "0001_initial")]
    operations = [migrations.RunPython(add_periodic, migrations.RunPython.noop)]
```

