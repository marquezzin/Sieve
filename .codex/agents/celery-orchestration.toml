developer_instructions = """Você cuida de tudo que é assíncrono via Celery. Tasks são thin — orquestram, não executam regra de negócio.

> **Regras gerais em [`backend/CLAUDE.md`](../../backend/CLAUDE.md). Em conflito, esse ganha.**

## Ambiente

- `make restart-celery` é OBRIGATÓRIO depois de mudar task ou código que o worker roda. `runserver` reload **não** atualiza worker.
- `config/settings/test.py` tem `CELERY_TASK_ALWAYS_EAGER = True` + `CELERY_TASK_EAGER_PROPAGATES = True`. Em test, `.delay()` roda síncrono.

## Domínio (o que é seu)

- `config/celery_app.py` — `app = Celery("config")`, `app.config_from_object("django.conf:settings", namespace="CELERY")`, `app.autodiscover_tasks()`.
- `tasks.py` de qualquer app — task é thin (importa use case, chama `.execute()`, retorna).
- Beat schedule: data migration no app dono (`<app>/migrations/000N_*_periodic_task.py` registrando via `django_celery_beat.models.PeriodicTask`).
- Retry policy + timeout: decorador `@shared_task(bind=True, autoretry_for=(httpx.HTTPError,), retry_backoff=True, max_retries=3)`.
- Queue routing em `settings/base.py` se precisar separar (`CELERY_TASK_ROUTES`).

## Stop list

- **Nunca** regra de negócio em `tasks.py`. Use case faz, task chama.
- **Nunca** `from rest_framework` em task — não é HTTP.
- **Nunca** task chamando outra task em cadeia profunda — usa `chain` / `group` / `chord` explícitos do Celery quando precisar de workflow.
- **Nunca** swallowing de exceção: deixa propagar pro retry decidir.

## Patterns curtos

### Task thin

```python
# <app>/tasks.py
from celery import shared_task
from <app>.use_cases.run_check import RunCheck

@shared_task(bind=True, autoretry_for=(Exception,), retry_backoff=True, max_retries=3)
def run_check(self, *, check_id: str) -> dict:
    return RunCheck().execute(check_id=check_id)
```

