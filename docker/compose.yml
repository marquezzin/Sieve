name: sieve

services:
  postgres:
    # pgvector/pgvector:pg18 = Postgres 18 oficial (Debian-based) + extensão
    # pgvector pré-instalada. Ativar em migration via `CREATE EXTENSION vector;`.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Aumenta max_connections — Django (autoreload) + Celery worker + Beat +
    # pytest-xdist (-n auto) saturam fácil o default 100 em dev.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      # Lado do host parametrizado pra evitar conflito com outros stacks locais
      # (ex: outro projeto já em 5432). Porta interna do container segue 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ (incluindo pgvector/pgvector:pg18) recomenda mount no
      # diretório pai /var/lib/postgresql — o Postgres cria internamente o
      # subdir versionado (ex: /var/lib/postgresql/18). Mount em
      # /var/lib/postgresql/data dispara "Error: ... unused mount/volume".
      # Ref: github.com/docker-library/postgres/pull/1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      # Host parametrizado (API + console) pra não colidir com outro MinIO local.
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
      # knowledge_base/ mora na raiz do repo (versionado, fácil pra humano
      # editar). Montado em /knowledge_base — match com
      # KNOWLEDGE_BASE_DIR = BASE_DIR.parent / "knowledge_base" em settings/base.py.
      - ../knowledge_base:/knowledge_base
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      # Host parametrizado; runserver segue em 8000 dentro do container.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    networks:
      - default

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
      - ../knowledge_base:/knowledge_base
    command: uv run celery -A config worker -l INFO
    networks:
      - default

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
      - ../knowledge_base:/knowledge_base
    command: uv run celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - default

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: pnpm dev --host 0.0.0.0
    ports:
      # Host parametrizado; Vite segue em 5173 dentro do container. O mapeamento
      # host→container preserva o HMR (browser conecta no host, encaminha pro 5173).
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    networks:
      - default

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
  backend_venv:

networks:
  default:
    driver: bridge
