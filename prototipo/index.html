<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sieve — Protótipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Brand primary remapped to a warm terracotta/clay (token name kept = 'indigo' for class reuse)
            indigo: { 0:'#fdf2ec',1:'#fadfd1',2:'#f4c1a6',3:'#ec9d78',4:'#e07c52',5:'#d6643c',6:'#cf5530',7:'#b8451f',8:'#963718',9:'#762c14' },
            // Warm neutral scale
            gray:   { 0:'#f8f6f2',1:'#f1ede6',2:'#e8e3d9',3:'#dbd4c7',4:'#c6bdac',5:'#a89e8c',6:'#7d7464',7:'#574f43',8:'#37312a',9:'#221d17' },
            ink:    { 0:'#f6f3ee',1:'#ece7df',7:'#4a4238',8:'#2e2820',9:'#1c1813' },
            cream:  { DEFAULT:'#faf7f2' },
            green:  { 0:'#ebfbee',1:'#d3f9d8',2:'#b2f2bb',3:'#8ce99a',4:'#69db7c',5:'#51cf66',6:'#40c057',7:'#37b24d',8:'#2f9e44',9:'#2b8a3e' },
            yellow: { 0:'#fff9db',1:'#fff3bf',2:'#ffec99',3:'#ffe066',4:'#ffd43b',5:'#fcc419',6:'#fab005',7:'#f59f00',8:'#f08c00',9:'#e67700' },
            red:    { 0:'#fff5f5',1:'#ffe3e3',2:'#ffc9c9',3:'#ffa8a8',4:'#ff8787',5:'#ff6b6b',6:'#fa5252',7:'#f03e3e',8:'#e03131',9:'#c92a2a' },
            teal:   { 6:'#0ca678',7:'#099268' },
          },
          fontFamily: {
            sans: ['"Hanken Grotesk"','-apple-system','BlinkMacSystemFont','Segoe UI','sans-serif'],
            display: ['"Bricolage Grotesque"','"Hanken Grotesk"','sans-serif'],
            mono: ['"JetBrains Mono"','ui-monospace','SFMono-Regular','monospace'],
          },
          borderRadius: { card: '16px', xl2: '20px' },
          boxShadow: {
            card: '0 1px 2px rgba(60,42,28,.05), 0 2px 6px -1px rgba(60,42,28,.05)',
            cardhover: '0 14px 34px -12px rgba(80,48,28,.20), 0 4px 12px -4px rgba(80,48,28,.10)',
            pop: '0 20px 50px -14px rgba(60,38,20,.30), 0 6px 18px -8px rgba(60,38,20,.18)',
            insetline: 'inset 0 1px 0 0 rgba(255,255,255,.7)',
            glow: '0 0 0 4px rgba(207,85,48,.14)',
          },
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; }
    body {
      color: #1c1813;
      background-color: #faf7f2;
      font-feature-settings: "ss01";
    }
    h1, h2, h3, .font-display { font-family: "Bricolage Grotesque", "Hanken Grotesk", sans-serif; letter-spacing: -0.02em; }
    .canvas-bg {
      background-color: #faf7f2;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(150,55,24,.05) 1px, transparent 0);
      background-size: 26px 26px;
    }
    .glow-top {
      background:
        radial-gradient(55% 60% at 82% -10%, rgba(214,100,60,.12), transparent 60%),
        radial-gradient(48% 50% at 2% 0%, rgba(232,124,82,.08), transparent 55%);
    }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    *::-webkit-scrollbar-thumb:hover { background: #ced4da; background-clip: content-box; }
    @keyframes fadeup { from { transform: translateY(10px); } to { transform: none; } }
    @keyframes fadein { from { transform: translateY(4px); } to { transform: none; } }
    @keyframes pop { from { transform: scale(.96); } to { transform: none; } }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes blink { 0%,60%,100% { transform: translateY(0); opacity:.4; } 30% { transform: translateY(-3px); opacity:1; } }
    @keyframes ringpulse { 0% { box-shadow: 0 0 0 0 rgba(207,85,48,.35);} 100% { box-shadow: 0 0 0 12px rgba(207,85,48,0);} }
    .skeleton { background: linear-gradient(90deg, #f1ede6 25%, #e8e3d9 50%, #f1ede6 75%); background-size: 800px 100%; animation: shimmer 1.5s infinite linear; }
    @media (prefers-reduced-motion: no-preference) {
      .fadeup { animation: fadeup .45s cubic-bezier(.2,.7,.3,1); }
      .fadein { animation: fadein .35s ease; }
      .pop { animation: pop .25s cubic-bezier(.2,.8,.3,1); }
    }
    .dot1 { animation: blink 1.2s infinite .0s; }
    .dot2 { animation: blink 1.2s infinite .18s; }
    .dot3 { animation: blink 1.2s infinite .36s; }
    .tnum { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* Composer fade — controllable per theme */
    .composer-fade { background: linear-gradient(to top, #faf7f2 62%, rgba(250,247,242,0)); }

    /* ════ Dark mode (Tweak) ════ */
    html.theme-dark { --gauge-track:#332c24; }
    html.theme-dark body { background-color:#16120e; color:#f4eee4; }
    html.theme-dark .canvas-bg { background-color:#16120e; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 0); }
    html.theme-dark .glow-top { background:
      radial-gradient(55% 60% at 82% -10%, rgba(214,100,60,.20), transparent 60%),
      radial-gradient(48% 50% at 2% 0%, rgba(232,124,82,.11), transparent 55%); }
    html.theme-dark .composer-fade { background: linear-gradient(to top, #16120e 62%, rgba(22,18,14,0)); }

    /* surfaces */
    html.theme-dark .bg-white { background-color:#211c16 !important; }
    html.theme-dark .bg-white\/40 { background-color:rgba(33,28,22,.5) !important; }
    html.theme-dark .bg-white\/60 { background-color:rgba(33,28,22,.62) !important; }
    html.theme-dark .bg-white\/70 { background-color:rgba(33,28,22,.72) !important; }
    html.theme-dark .bg-white\/80 { background-color:rgba(33,28,22,.82) !important; }
    html.theme-dark .bg-white\/90 { background-color:rgba(33,28,22,.9) !important; }
    html.theme-dark .bg-cream\/90 { background-color:rgba(28,23,18,.82) !important; }
    html.theme-dark .bg-gray-0 { background-color:rgba(255,255,255,.04) !important; }
    html.theme-dark .bg-gray-1 { background-color:rgba(255,255,255,.055) !important; }
    html.theme-dark .bg-gray-2 { background-color:rgba(255,255,255,.08) !important; }
    html.theme-dark .to-white { --tw-gradient-to:#211c16 !important; }
    html.theme-dark .from-indigo-0 { --tw-gradient-from:rgba(207,85,48,.20) !important; }

    /* text */
    html.theme-dark .text-ink-9, html.theme-dark .text-gray-9 { color:#f4eee4 !important; }
    html.theme-dark .text-ink-8, html.theme-dark .text-gray-8 { color:#e0d6c8 !important; }
    html.theme-dark .text-ink-7, html.theme-dark .text-gray-7 { color:#c6bbab !important; }
    html.theme-dark .text-gray-6 { color:#ada291 !important; }
    html.theme-dark .text-gray-5 { color:#8c8271 !important; }
    html.theme-dark .text-gray-4 { color:#6f6655 !important; }

    /* borders */
    html.theme-dark .border-gray-1 { border-color:rgba(255,255,255,.06) !important; }
    html.theme-dark .border-gray-2 { border-color:rgba(255,255,255,.10) !important; }
    html.theme-dark .border-gray-3 { border-color:rgba(255,255,255,.15) !important; }
    html.theme-dark .border-gray-4 { border-color:rgba(255,255,255,.22) !important; }

    /* icon-tile rings — flatten light outlines in dark */
    html.theme-dark .ring-gray-1 { --tw-ring-color:rgba(255,255,255,.06) !important; }
    html.theme-dark .ring-gray-2 { --tw-ring-color:rgba(255,255,255,.10) !important; }
    html.theme-dark .ring-gray-3 { --tw-ring-color:rgba(255,255,255,.14) !important; }

    /* accent (terracotta) tints */
    html.theme-dark .bg-indigo-0 { background-color:rgba(207,85,48,.18) !important; }
    html.theme-dark .text-indigo-6 { color:#ef9b76 !important; }
    html.theme-dark .text-indigo-7 { color:#f0a47f !important; }
    html.theme-dark .text-indigo-8 { color:#f3b193 !important; }
    html.theme-dark .ring-indigo-1 { --tw-ring-color:rgba(207,85,48,.30) !important; }

    /* semantic soft */
    html.theme-dark .bg-green-0 { background-color:rgba(64,192,87,.15) !important; }
    html.theme-dark .text-green-7, html.theme-dark .text-green-8 { color:#69db7c !important; }
    html.theme-dark .ring-green-1 { --tw-ring-color:rgba(64,192,87,.30) !important; }
    html.theme-dark .bg-yellow-1 { background-color:rgba(250,176,5,.16) !important; }
    html.theme-dark .text-yellow-7, html.theme-dark .text-yellow-8 { color:#ffd43b !important; }
    html.theme-dark .ring-yellow-2 { --tw-ring-color:rgba(250,176,5,.30) !important; }
    html.theme-dark .bg-red-0 { background-color:rgba(250,82,82,.15) !important; }
    html.theme-dark .text-red-6, html.theme-dark .text-red-7 { color:#ff8787 !important; }
    html.theme-dark .ring-red-1 { --tw-ring-color:rgba(250,82,82,.30) !important; }

    /* misc */
    html.theme-dark .skeleton { background:linear-gradient(90deg,#241e18 25%,#2e271f 50%,#241e18 75%); background-size:800px 100%; }

    /* texture / glow toggles */
    html.no-texture .canvas-bg { background-image:none !important; }
    html.no-glow .glow-top { display:none !important; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/bundle.jsx"></script>
</body>
</html>
